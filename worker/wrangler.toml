name = "tg-cloud-drive-worker"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# === Environment variables (set via wrangler secret or dashboard) ===
# TG_BOT_TOKEN             — Telegram Bot Token from @BotFather
# STORAGE_CHANNEL_ID       — Group/channel where bot stores files (bot must be admin)
# DRIVE_AUTH_TOKEN         — Bearer token for web app authentication
# AGENT_API_TOKEN          — Bearer token for /api/agent/* (Hermes Agent integration)
# AGENT_DEFAULT_TOPIC      — Default topic ID for agent uploads/transfers (optional, default: 20)
# SHARE_PASSWORD_KEY       — base64url key (16/24/32 random bytes) for AES-GCM
#                            encryption of share passwords shown in admin
#                            (optional; without it new shares store no display copy)

# === D1 — Metadata database ===
[[d1_databases]]
binding = "DB"
database_name = "tgcd-meta"
database_id = "272adc8d-f526-4bfb-97b2-6b3f63c992b9"

# === KV — Share links ===
[[kv_namespaces]]
binding = "SHARES"
id = "468970ee2dbd4779ad0b85649fdfa7e3"

# === Cron — intentionally disabled ===
# Orphan cleanup was cron `0 */6 * * *` (every 6h, older than 2h).
# Removed 2026-11-07: account cron slots were full (5/5), cleanup is now
# manual via POST /api/admin/cleanup-orphans (frontend "Clean Orphans Now").
# Do NOT re-add a cron here without checking slot availability first.
# scheduledHandler in src/index.ts is kept for manual / future use.
